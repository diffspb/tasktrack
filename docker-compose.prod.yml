services:
  app:
    # PaaS-деплоер собирает образ из исходников (`up --build`) и лишь помечает его этим именем.
    image: ghcr.io/diffspb/tasktrack:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://tasktrack:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tasktrack
